<!DOCTYPE html>
<html>
<head>
    <title>Research Bot</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .sidebar {
            width: 220px;
            border-right: 1px solid #ddd;
            padding: 15px;
            background: white;
            height: 100vh;
            box-sizing: border-box;
        }

        .sidebar button {
            width: 100%;
            padding: 10px;
            background: #4a7c59;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .sidebar button:hover {
            background: #3d6849;
        }

        .chat-item {
            padding: 8px 10px;
            margin-top: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }

        .chat-item:hover {
            background: #eee;
        }

        .chat-item.active {
            background: #e4efe8;
            font-weight: bold;
        }

        .main {
            flex: 1;
            padding: 20px;
        }

        #messages {
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            height: 420px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 10px;
        }

        .msg {
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            max-width: 80%;
        }

        .msg.you {
            background: #dcf0e3;
            margin-left: auto;
        }

        .msg.bot {
            background: #f0f0f0;
        }

        #userInput {
            padding: 10px;
            width: 70%;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        #sendBtn {
            padding: 10px 18px;
            background: #4a7c59;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #sendBtn:hover {
            background: #3d6849;
        }
    </style>
</head>
<body>

<div style="display:flex;">

    <div class="sidebar">
        <button onclick="newChat()">+ New Chat</button>
        <div id="chatList"></div>
    </div>

    <div class="main">
        <h2>Research Bot</h2>
        <div id="messages"></div>
        <input type="text" id="userInput" placeholder="Start by saying hi" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

</div>


<script>

//figure out which chat we r currently in
let userId = localStorage.getItem("currentChatId")
if (!userId) {
    userId = "chat_" + Math.random().toString(36).substring(2, 10)
    localStorage.setItem("currentChatId", userId)
}

function getChatList() {
    let list = localStorage.getItem("chatList")
    if (list) {
        return JSON.parse(list)
    }
    return []
}

function saveChatList(list) {
    localStorage.setItem("chatList", JSON.stringify(list))
}

function addToChatList(id) {
    let list = getChatList()
    if (!list.includes(id)) {
        list.push(id)
        saveChatList(list)
    }
}

//uses the first message in a chat as its title like agentchatui
async function renderChatList() {
    let list = getChatList()
    let container = document.getElementById("chatList")
    container.innerHTML = ""

    for (let i = 0; i < list.length; i++) {
        let id = list[i]

        let jobResponse = await fetch("/job/" + id)
        let jobData = await jobResponse.json()

        let title = "New Chat"
        if (jobData.job) {
            title = "Chat for " + jobData.job
        }

        let item = document.createElement("div")
        item.textContent = title
        item.style.cursor = "pointer"
        item.style.padding = "5px"
        if (id === userId) {
            item.style.fontWeight = "bold"
        }
        item.onclick = function() {
            switchChat(id)
        }
        container.appendChild(item)
    }
}

function switchChat(id) {
    userId = id
    localStorage.setItem("currentChatId", id)
    document.getElementById("messages").innerHTML = ""
    loadHistory()
    renderChatList()
}

function newChat() {
    let id = "chat_" + Math.random().toString(36).substring(2, 10)
    addToChatList(id)
    switchChat(id)
}

async function loadHistory() {
    let response = await fetch("/history/" + userId)
    let data = await response.json()
    for (let i = 0; i < data.messages.length; i++) {
        let msg = data.messages[i]
        if (msg.role === "user") {
            addMessage(msg.content, "You")
        } else {
            addMessage(msg.content, "Bot")
        }
    }
}

function addMessage(text, sender) {
    let messages = document.getElementById("messages")
    let div = document.createElement("div")
    if (sender === "Bot") {
        div.className = "msg bot"
        div.innerHTML = marked.parse(text)
    } else {
        div.className = "msg you"
        div.textContent = text
    }
    messages.appendChild(div)
    messages.scrollTop = messages.scrollHeight
}

async function sendMessage() {
    let input = document.getElementById("userInput")
    let message = input.value
    if (!message) {
        return
    }

    addMessage(message, "You")
    input.value = ""

    let response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({user_id: userId, message: message})
    })
    let data = await response.json()
    addMessage(data.reply, "Bot")
    renderChatList()
}

//page just loaded, set everything up
addToChatList(userId)
renderChatList()
loadHistory()

</script>
</body>
</html>
